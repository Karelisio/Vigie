name: Release

# Une version = un tag vX.Y.Z : APK signé + GitHub Release avec changelog.
# L'image de l'agent X.Y.Z / latest est publiée par le workflow « Agent » sur le même tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existant à (re)publier, ex. v1.2.0"
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Secrets de signature et Firebase
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 manquant (voir README, étape 6)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vigie.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/vigie.jks" >> "$GITHUB_ENV"
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 absent : l'APK n'aura pas les notifications push."
          fi

      - name: Version
        run: |
          echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Compilation de l'APK signé
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/vigie-$VERSION_NAME.apk"
          # Vérifie que l'APK est bien signé avec le keystore fourni (et non la clé de debug).
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$APKSIGNER" verify --print-certs "dist/vigie-$VERSION_NAME.apk" | tee cert.txt
          if grep -q "CN=Android Debug" cert.txt; then echo "::error::APK signé avec la clé de debug"; exit 1; fi
          (cd dist && sha256sum "vigie-$VERSION_NAME.apk" > "vigie-$VERSION_NAME.apk.sha256")

      - name: Changelog
        run: |
          # Section « ## [X.Y.Z] » de CHANGELOG.md, sinon les commits depuis le tag précédent.
          awk -v v="$VERSION_NAME" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ] || [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
            RANGE=${PREV:+$PREV..}$TAG
            git log --no-merges --pretty='- %s' $RANGE > notes.md
          fi
          printf '\n\n---\nImage de l'"'"'agent : `ghcr.io/%s/vigie-agent:%s`\n' "${GITHUB_REPOSITORY_OWNER,,}" "$VERSION_NAME" >> notes.md
          cat notes.md

      - name: Publication de la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Vigie ${{ env.VERSION_NAME }}
          body_path: notes.md
          files: |
            dist/vigie-${{ env.VERSION_NAME }}.apk
            dist/vigie-${{ env.VERSION_NAME }}.apk.sha256
          make_latest: true
