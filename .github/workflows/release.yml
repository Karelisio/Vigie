name: Release

# Une version = un tag vX.Y.Z → APK signés (téléphone et montre) + GitHub Release (changelog) + image de l'agent X.Y.Z et latest.
# Trois façons de publier :
#   - modifier le fichier VERSION (ex. 0.2.0) et pousser : le tag est créé ici s'il n'existe pas ;
#   - créer une release / un tag vX.Y.Z sur GitHub ;
#   - lancer ce workflow à la main (Actions › Release › Run workflow) avec la version.
on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths: ["VERSION"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, ex. 0.2.0 (le tag vX.Y.Z est créé sur la branche choisie)"
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then V="${INPUT_VERSION#v}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"
          else V="$(tr -d '[:space:]' < VERSION)"; V="${V#v}"; fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Version invalide : $V (attendu X.Y.Z)"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          SKIP=false
          # Fichier VERSION modifié sans changement de numéro : rien à publier.
          if [ "$GITHUB_REF_TYPE" = "branch" ] && [ "$GITHUB_EVENT_NAME" = "push" ] && git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "::notice::La version $V est déjà publiée."
            SKIP=true
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
      - name: Création du tag
        if: github.ref_type != 'tag' && steps.v.outputs.skip != 'true'
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Le tag $TAG existe déjà."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Vigie ${TAG#v}"
          git push origin "$TAG"

  image:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Nom d'image en minuscules
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vigie-agent" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        env:
          V: ${{ needs.prepare.outputs.version }}
        run: echo "list=$IMAGE:$V,$IMAGE:${V%.*},$IMAGE:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          build-args: VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  apk:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION_NAME: ${{ needs.prepare.outputs.version }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Secrets de signature et Firebase
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 manquant (voir README, étape 6)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vigie.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/vigie.jks" >> "$GITHUB_ENV"
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 absent : l'APK n'aura pas les notifications push."
          fi

      - name: Compilation des APK signés (téléphone et montre)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease :wear:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/vigie-$VERSION_NAME.apk"
          # Montre Wear OS : même identifiant et même clé que le téléphone (obligatoire pour la Data Layer).
          cp wear/build/outputs/apk/release/wear-release.apk "dist/vigie-wear-$VERSION_NAME.apk"
          # Vérifie que les APK sont signés avec le keystore fourni (et non la clé de debug), avec le même certificat.
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$APKSIGNER" verify --print-certs "dist/vigie-$VERSION_NAME.apk" | tee cert.txt
          "$APKSIGNER" verify --print-certs "dist/vigie-wear-$VERSION_NAME.apk" | tee cert-wear.txt
          if grep -q "CN=Android Debug" cert.txt cert-wear.txt; then echo "::error::APK signé avec la clé de debug"; exit 1; fi
          if [ "$(grep SHA-256 cert.txt)" != "$(grep SHA-256 cert-wear.txt)" ]; then echo "::error::Les APK du téléphone et de la montre n'ont pas la même signature"; exit 1; fi
          (cd dist && sha256sum "vigie-$VERSION_NAME.apk" > "vigie-$VERSION_NAME.apk.sha256")
          (cd dist && sha256sum "vigie-wear-$VERSION_NAME.apk" > "vigie-wear-$VERSION_NAME.apk.sha256")

      - name: Changelog
        run: |
          # Section « ## [X.Y.Z] » de CHANGELOG.md, sinon les commits depuis le tag précédent.
          awk -v v="$VERSION_NAME" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md || true
          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
            git log --no-merges --pretty='- %s' ${PREV:+$PREV..}$TAG > notes.md
          fi
          printf '\n\n---\nImage de l'"'"'agent : `ghcr.io/%s/vigie-agent:%s`\n' "${GITHUB_REPOSITORY_OWNER,,}" "$VERSION_NAME" >> notes.md
          cat notes.md

      - name: Publication de la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Vigie ${{ env.VERSION_NAME }}
          body_path: notes.md
          files: |
            dist/vigie-${{ env.VERSION_NAME }}.apk
            dist/vigie-${{ env.VERSION_NAME }}.apk.sha256
            dist/vigie-wear-${{ env.VERSION_NAME }}.apk
            dist/vigie-wear-${{ env.VERSION_NAME }}.apk.sha256
          make_latest: true
