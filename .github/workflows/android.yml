name: Android

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: google-services.json (facultatif)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          else
            echo "::notice::GOOGLE_SERVICES_JSON_BASE64 absent : compilation sans Firebase."
          fi

      - name: Compilation et tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: vigie-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
